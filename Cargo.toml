[package]
name = "pino"
version = "0.2.3"
authors = ["Lluc Simó Margalef <lluc.simo@protonmail.com>"]
description = "Experimental app to export audio files generating a Pioneer-compatible USB drive"
license = "AGPL-3.0-or-later"
edition = "2024"

[dependencies]
anyhow = "1"
aoide = { git = "https://gitlab.com/uklotzde/aoide-rs", rev = "2d79c527c0b6eb7fdedec98c6d0fb6b2dc5698eb", features = ["desktop-app", "backend-embedded", "sqlite-bundled", "media-file", "tokio"] }
rekordcrate = { git = "https://github.com/Holzhaus/rekordcrate", rev = "82a6077bda95b072186aa551af27e2135217a30d", default-features = false, features = ["artwork"] }
unicode-normalization = "0.1"
chrono = "0.4.44"
dioxus = { version = "0.7.5", features = ["desktop"] }
rfd = "0.17.2"
tokio = { version = "1", features = ["sync", "rt"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"
open = "5"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "09d6a913cd1fbcd258b6a5d97bd780b1808b5c0a", version = "0.0.1", default-features = false }
uuid = { version = "1", features = ["v4"] }
rayon = "1"

[lints.clippy]
all = "warn"
pedantic = "warn"
